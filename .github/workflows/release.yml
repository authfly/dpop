name: Release

# Runs only when a maintainer pushes a v* tag. Produces a source archive and
# SHA256SUMS, attaches SLSA build provenance (Sigstore-signed, stored in the
# GitHub attestations API) and publishes a GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write         # create the GitHub release
      id-token: write         # Sigstore signing certificate via OIDC
      attestations: write     # store the attestation
      artifact-metadata: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Build source archive
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="dpop-${TAG}/" -o "dist/dpop-${TAG}.tar.gz" "$GITHUB_SHA"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag             --title "$TAG" --generate-notes             $(case "$TAG" in *-*) echo --prerelease;; esac)
