name: Release

# Runs when a maintainer pushes a v* tag, or manually (workflow_dispatch) for an
# existing tag, e.g. when a tag-triggered run got stuck. Produces a source
# archive and SHA256SUMS, attaches SLSA build provenance (Sigstore-signed,
# stored in the GitHub attestations API) and publishes a GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (e.g. v0.1.1)
        required: true
        type: string

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        run: |
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - run: go mod verify
      - run: go vet ./...
      - run: go test -race -count=1 ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write         # create the GitHub release
      id-token: write         # Sigstore signing certificate via OIDC
      attestations: write     # store the attestation
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check tag is on main
        run: |
          SHA=$(git rev-parse "refs/tags/${TAG}^{commit}")
          echo "SHA=$SHA" >> "$GITHUB_ENV"
          git merge-base --is-ancestor "$SHA" origin/main
      - name: Build source archive
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix="dpop-${TAG}/" -o "dist/dpop-${TAG}.tar.gz" "$SHA"
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Attest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag             --title "$TAG" --generate-notes             $(case "$TAG" in *-*) echo --prerelease;; esac)
